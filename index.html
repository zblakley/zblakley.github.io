<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Kingmaker</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div id="setup" class="screen"></div>
<div id="game" class="screen" hidden>
  <header id="top"></header>
  <main id="stage">
    <div id="mapwrap">
      <div id="map"></div>
      <div id="mapctl"><button data-act="zoom-in" title="Zoom in (+)">+</button><button data-act="zoom-out" title="Zoom out (−)">−</button><button data-act="zoom-fit" title="Whole map (0)">▢</button></div>
      <div id="legend"></div>
      <div id="banner" hidden></div>
      <div id="tray"></div>
    </div>
    <aside id="side"><nav id="tabs"></nav><div id="panel"></div></aside>
  </main>
</div>
<div id="pop" hidden></div>
<div id="modal" hidden><div id="modalbox" role="dialog" aria-modal="true"></div></div>
<div id="curtain" hidden></div>
<script src="js/data/map.js"></script>
<script src="js/data/cards.js"></script>
<script src="js/engine.js"></script>
<script src="js/ai.js"></script>
<script src="js/heraldry.js"></script>
<script src="js/board.js"></script>
<script src="js/ui.js"></script>
</body>
</html>
